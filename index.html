<style type="text/tailwindcss">

    --color-fondo: var(--bg);

    --color-muted: var(--muted);
    --color-acento: var(--accent);
    --color-linea: var(--border);

<style>
/* ============================ Tokens de tema ============================ */
:root { --ease: cubic-bezier(.22,.8,.24,1); }
[data-theme="light"] {
  --bg: #FAF9F5;
  --glow-1: transparent;  --glow-2: transparent;
  --card: #FFFFFF;  --card-hover: #FFFFFF;
  --border: #E8E6DC; --border-strong: #D1CFC5;
  --text: #141413;  --muted: #6B6A63;
  --accent: #C96442; --accent-2: #D97757; --accent-soft: rgba(201,100,66,.09);
  --cta-bg: #C96442; --cta-text: #FFFFFF; --on-accent: #FFFFFF;
  --shadow: 0 1px 2px rgba(20,20,19,.03), 0 8px 24px -12px rgba(20,20,19,.08);
  --ambient: 0 24px 60px -30px rgba(20,20,19,.30);
  --track: #EDEBE3;  --header: rgba(250,249,245,.85);
}
[data-theme="sepia"] {
  --bg: #F3EBD9;
  --glow-1: transparent;  --glow-2: transparent;
  --card: #FAF4E4;  --card-hover: #FCF7EA;
  --border: #E2D5B8; --border-strong: #CDBF9E;
  --text: #3E3022;  --muted: #7B6B53;
  --accent: #9E5427; --accent-2: #B4673A; --accent-soft: rgba(158,84,39,.10);
  --cta-bg: #9E5427; --cta-text: #FFF9EC; --on-accent: #FFF9EC;
  --shadow: 0 1px 2px rgba(62,48,34,.04), 0 8px 24px -12px rgba(62,48,34,.12);
  --ambient: 0 24px 60px -30px rgba(62,48,34,.35);
  --track: #E8DDC3;  --header: rgba(243,235,217,.88);
}
[data-theme="dark"] {
  --bg: #262624;
  --glow-1: transparent;  --glow-2: transparent;
  --card: #30302E;  --card-hover: #353533;
  --border: rgba(255,255,255,.08); --border-strong: rgba(255,255,255,.17);
  --text: #FAF9F5;  --muted: #A8A69D;
  --accent: #D97757; --accent-2: #E08D70; --accent-soft: rgba(217,119,87,.14);
  --cta-bg: #D97757; --cta-text: #1F1E1D; --on-accent: #1F1E1D;
  --shadow: 0 1px 2px rgba(0,0,0,.2), 0 12px 32px -16px rgba(0,0,0,.5);
  --ambient: 0 24px 60px -30px rgba(0,0,0,.7);
  --track: rgba(255,255,255,.09);  --header: rgba(38,38,36,.85);
}

/* ============================ Base ============================ */
body {
  font-family: 'DM Sans', system-ui, sans-serif; color: var(--text); background: var(--bg);
  min-height: 100vh; line-height: 1.6; -webkit-font-smoothing: antialiased;
  transition: background .5s var(--ease), color .5s var(--ease);
}
body::before { /* halo ambiental de fondo */
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: radial-gradient(900px 520px at 85% -10%, var(--glow-1), transparent 65%),
              radial-gradient(800px 600px at -10% 30%, var(--glow-2), transparent 60%);
}
h1, h2, h3 { font-family: 'Newsreader', Georgia, serif; font-weight: 500; letter-spacing: -.015em; line-height: 1.15; text-wrap: balance; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 8px; }
.eyebrow { font-size: .7rem; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
.vista { animation: subir .6s var(--ease) both; }
@keyframes subir { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

/* ============================ Componentes ============================ */
.glass { /* tarjeta: blanca con sombra suave (claro) / gris cálido (oscuro) */
  background: var(--card); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  transition: transform .45s var(--ease), border-color .35s, background .35s, box-shadow .45s;
}
a.glass:hover { transform: translateY(-5px); border-color: var(--border-strong); background: var(--card-hover); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  padding: 11px 20px; border-radius: 10px; font-weight: 500; font-size: .9rem;
  border: 1px solid var(--border-strong);
  transition: transform .35s var(--ease), box-shadow .35s, border-color .3s, background .3s, color .3s;
}
.btn:hover { transform: translateY(-2px); border-color: var(--accent); }
.btn:active { transform: scale(.98); }
.btn-cta { background: var(--cta-bg); color: var(--cta-text); border-color: transparent; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.btn-cta:hover { border-color: transparent; box-shadow: 0 6px 18px -8px var(--accent); }
.btn.copiado { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.btn-cta.hecha { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); box-shadow: none; }

.icon-btn {
  width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; flex: none;
  border: 1px solid var(--border); transition: border-color .3s, background .3s, color .3s;
}
.icon-btn:hover { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
[data-theme="light"] :is(.t-sepia,.t-dark), [data-theme="sepia"] :is(.t-light,.t-dark), [data-theme="dark"] :is(.t-light,.t-sepia) { display: none; }
.icon-btn[disabled] { opacity: .35; pointer-events: none; }

/* Barra de progreso minimalista */
.bar { height: 4px; border-radius: 99px; background: var(--track); }
.bar > i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .9s var(--ease); }

/* Anillo de avance global */
.anillo circle { fill: none; stroke-width: 5; }
.anillo .pista { stroke: var(--track); }
.anillo .valor { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset 1.2s var(--ease); }

/* Filtros tipo píldora */
.pill { padding: 8px 18px; border-radius: 99px; font-size: .84rem; font-weight: 500; white-space: nowrap; border: 1px solid var(--border); color: var(--muted); transition: all .35s var(--ease); }
.pill:hover { color: var(--text); border-color: var(--border-strong); }
.pill.activa { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

/* Indicadores de estado */
.badge { display: inline-flex; align-items: center; gap: 7px; padding: 4px 11px; border-radius: 99px; font-size: .7rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge.curso { color: var(--text); border-color: var(--border-strong); }
.badge.curso::before { background: var(--accent); animation: pulso 2s ease-in-out infinite; }
.badge.listo { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
@keyframes pulso { 50% { opacity: .35; } }

/* Campo de texto */
.campo { width: 100%; padding: 13px 16px; border-radius: 12px; color: var(--text); background: transparent; border: 1px solid var(--border-strong); transition: border-color .3s, box-shadow .3s; }
.campo::placeholder { color: var(--muted); opacity: .8; }
.campo:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }

/* Check circular de lección */
.dot { width: 20px; height: 20px; flex: none; border-radius: 50%; border: 1px solid var(--border-strong); display: grid; place-items: center; transition: all .35s var(--ease); }
.dot svg { width: 12px; height: 12px; stroke-width: 3; opacity: 0; transform: scale(.4); transition: all .35s var(--ease); }
.done .dot { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.done .dot svg { opacity: 1; transform: none; }

/* Índice de lecciones (sidebar) */
.item { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 12px; font-size: .88rem; border: 1px solid transparent; transition: background .3s, border-color .3s; }
.item:hover { background: var(--card-hover); border-color: var(--border); }
.item.actual { background: var(--accent-soft); border-color: var(--accent); }
.sala.sin-indice .indice { display: none; }
@media (min-width: 1024px) {
  .sala { display: grid; grid-template-columns: 320px minmax(0,1fr); gap: 32px; align-items: start; }
  .sala.sin-indice { grid-template-columns: minmax(0,1fr); }
  .sala.sin-indice .contenido { max-width: 980px; margin-inline: auto; width: 100%; }
}

/* Reproductor 16:9 con sombra ambiental */
.player { aspect-ratio: 16/9; border-radius: 14px; overflow: hidden; background: #000; position: relative; box-shadow: var(--ambient); border: 1px solid var(--border); }
.player iframe { width: 100%; height: 100%; border: 0; display: block; }
.player .vacio { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; text-align: center; gap: 8px; color: #A8A69D; padding: 24px; background: radial-gradient(circle at 50% 40%, #3A3936, #1F1E1D 75%); }

/* Pestañas */
.tab { position: relative; padding: 14px 2px; font-size: .9rem; font-weight: 500; color: var(--muted); white-space: nowrap; transition: color .3s; display: inline-flex; align-items: center; gap: 8px; }
.tab::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--accent); transform: scaleX(0); transition: transform .45s var(--ease); }
.tab:hover { color: var(--text); }
.tab.activa { color: var(--accent); }
.tab.activa::after { transform: scaleX(1); }
.panel { animation: subir .45s var(--ease) both; }

/* ---- Mejoras de estudio ---- */
.btn-cta { position: relative; }
.btn-cta.pop::after { content: ""; position: absolute; inset: -2px; border-radius: inherit; border: 2px solid var(--accent); animation: onda .7s var(--ease) forwards; pointer-events: none; }
@keyframes onda { from { opacity: .8; transform: scale(1); } to { opacity: 0; transform: scale(1.18, 1.7); } }

/* Tira de avance del módulo (un segmento por clase) */
.seg { position: relative; flex: 1; height: 6px; border-radius: 99px; background: var(--track); transition: background .4s, transform .3s var(--ease); }
.seg::after { content: ""; position: absolute; inset: -8px 0; }
.seg:hover { transform: scaleY(1.6); }
.seg.done { background: var(--accent); }
.seg.actual:not(.done) { background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.seg.actual.done { box-shadow: 0 0 0 2px var(--card), 0 0 0 3px var(--accent); }

/* Lectura: tamaño ajustable (A− / A+) */
.lec { font-size: var(--lec, 1.2rem); line-height: 1.7; }

/* Puntos clave como checklist */
.clave { display: flex; align-items: flex-start; gap: 8px; border-radius: 12px; padding: 0 8px 0 6px; transition: background .3s; }
.clave:hover { background: var(--card-hover); }
.clave.done .txt { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--border-strong); }

/* Racha semanal */
.dia { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: .65rem; font-weight: 600; border: 1px solid var(--border-strong); color: var(--muted); }
.dia.ok { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.dia.hoy { box-shadow: 0 0 0 2px var(--card), 0 0 0 3px var(--accent); }

/* Portadas de módulo */
.portada svg { transition: transform .9s var(--ease); }
a:hover .portada svg { transform: scale(1.06); }

kbd { font: inherit; font-size: .7rem; padding: 1px 6px; border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: 6px; background: var(--card); }

/* Modo foco: solo video y contenido de la clase */
.foco-salir { position: fixed; top: 16px; right: 16px; z-index: 30; display: none; }
body.foco header, body.foco footer, body.foco .indice, body.foco .no-foco { display: none !important; }
body.foco .foco-salir { display: inline-flex; }
body.foco .sala { grid-template-columns: minmax(0,1fr); }
body.foco .contenido { max-width: 960px; margin-inline: auto; width: 100%; }
body.foco main { padding-top: 4rem; }

/* Aviso breve (toast) */
.aviso { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 60; display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-radius: 12px; background: var(--text); color: var(--bg); font-size: .88rem; box-shadow: var(--ambient); max-width: calc(100vw - 32px); animation: entra .4s var(--ease); }
.aviso svg { color: var(--accent-2); flex: none; }
.aviso.sale { opacity: 0; transform: translate(-50%, 8px); transition: all .45s var(--ease); }
@keyframes entra { from { opacity: 0; transform: translate(-50%, 12px); } }

/* Celebración al cerrar un módulo */
.celebra { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 20px; background: rgba(20,20,19,.45); backdrop-filter: blur(4px); animation: fundido .3s both; }
.celebra-card { max-width: 440px; width: 100%; padding: 40px 32px; text-align: center; animation: subir .55s var(--ease) both; }
.sello { position: relative; width: 72px; height: 72px; margin: 0 auto 26px; border-radius: 50%; border: 1.5px solid var(--accent); display: grid; place-items: center; color: var(--accent); background: var(--accent-soft); }
.sello svg { width: 34px; height: 34px; stroke-dasharray: 30; stroke-dashoffset: 30; animation: trazo .6s .25s var(--ease) forwards; }
.rayo { position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; margin: -2.5px; border-radius: 50%; background: var(--accent); opacity: 0; animation: rayo .9s .2s var(--ease) both; }
@keyframes trazo { to { stroke-dashoffset: 0; } }
@keyframes fundido { from { opacity: 0; } }
@keyframes rayo { 0% { opacity: 1; transform: rotate(var(--a)) translateY(-40px); } 100% { opacity: 0; transform: rotate(var(--a)) translateY(-70px); } }

/* Transición suave entre vistas (si el navegador la soporta) */
::view-transition-group(root) { animation-duration: .35s; }

.temblar { animation: temblar .4s; }
@keyframes temblar { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.sin-scroll::-webkit-scrollbar { display: none; } .sin-scroll { scrollbar-width: none; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

/* ==========================================================================
   2. ESTADO Y PERSISTENCIA (localStorage)
   ========================================================================== */
const CLAVE = 'ch_estado';
const app = document.getElementById('app');
const MODULOS = PLATFORM_CONFIG.modules;
const LECCIONES = MODULOS.flatMap(m => m.lessons);

// acceso: sesión iniciada · nombre: nombre del socio (se conserva al cerrar sesión) · hechas: lecciones completadas
// ultima: última lección vista por módulo · apuntes: apuntes personales indexados por id de lección
let estado = { acceso: false, nombre: '', tema: 'light', hechas: {}, ultima: {}, apuntes: {}, indiceCerrado: false,
               claves: {}, dias: {}, fuente: 1, ultimaClase: null }; // claves: puntos aplicados · dias: días con estudio · fuente: tamaño de lectura (0-2)
try { Object.assign(estado, JSON.parse(localStorage.getItem(CLAVE) || '{}')); } catch (e) {}
const guardar = () => { try { localStorage.setItem(CLAVE, JSON.stringify(estado)); } catch (e) {} };

// Estado de interfaz (no se guarda)
let filtro = 'Todos', busqueda = '', tabActiva = null, foco = false;
if (![0, 1, 2].includes(estado.fuente)) estado.fuente = 1;

/* ==========================================================================
   3. UTILIDADES
   ========================================================================== */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const idValido = id => /^[\w-]{6,80}$/.test(id || '');           // evita inyectar algo raro en las URLs de embed
const plano = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); // búsqueda sin tildes
const ic = (nombre, cls = 'w-4 h-4') => `<i data-lucide="${nombre}" class="${cls}"></i>`;
const iconos = () => window.lucide && lucide.createIcons();

// Botón que rota entre los tres temas: claro → sepia → oscuro (muestra el icono del tema activo)
const TEMAS = ['light', 'sepia', 'dark'];
const btnTema = (extra = '') => `<button class="icon-btn ${extra}" data-accion="tema" aria-label="Cambiar tema (claro, sepia, oscuro)" title="Cambiar tema">${ic('sun', 'w-4 h-4 t-light')}${ic('book-open', 'w-4 h-4 t-sepia')}${ic('moon', 'w-4 h-4 t-dark')}</button>`;

// Aviso breve en la parte inferior (confirmaciones y mensajes de ánimo)
function aviso(txt, icono = 'check') {
  document.querySelector('.aviso')?.remove();
  const d = document.createElement('div');
  d.className = 'aviso'; d.setAttribute('role', 'status');
  d.innerHTML = `${ic(icono, 'w-4 h-4')}<span>${esc(txt)}</span>`;
  document.body.appendChild(d); iconos();
  setTimeout(() => d.classList.add('sale'), 2600);
  setTimeout(() => d.remove(), 3150);
}

const hecha = id => !!estado.hechas[id];
const moduloDe = l => MODULOS.find(m => m.lessons.includes(l));

// ---- Racha: se cuenta un día cada vez que el socio entra a estudiar una clase ----
const claveDia = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
function registrarDia() { const k = claveDia(new Date()); if (!estado.dias[k]) { estado.dias[k] = 1; guardar(); } }
function racha() { // días consecutivos hasta hoy (o hasta ayer, si hoy todavía no estudió)
  const d = new Date(); if (!estado.dias[claveDia(d)]) d.setDate(d.getDate() - 1);
  let n = 0; while (estado.dias[claveDia(d)]) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function semana() { // lunes a domingo de la semana actual
  const hoy = new Date(), lun = new Date(hoy); lun.setDate(hoy.getDate() - ((hoy.getDay() + 6) % 7));
  return [...Array(7)].map((_, i) => { const d = new Date(lun); d.setDate(lun.getDate() + i); return { letra: 'LMXJVSD'[i], ok: !!estado.dias[claveDia(d)], hoy: claveDia(d) === claveDia(hoy) }; });
}
// Clase a la que conviene volver: la última vista si sigue pendiente, o la primera pendiente
function claseSugerida() {
  const ult = LECCIONES.find(l => l.id === estado.ultimaClase);
  return (ult && !hecha(ult.id)) ? ult : (LECCIONES.find(l => !hecha(l.id)) || null);
}
const cuenta = ls => ls.filter(l => hecha(l.id)).length;
const pct = ls => ls.length ? Math.round(cuenta(ls) / ls.length * 100) : 0;

// Estado de un módulo: Sin empezar / En curso / Completado
function estadoModulo(m) {
  const n = cuenta(m.lessons);
  if (n === m.lessons.length && n > 0) return { txt: 'Completado', cls: 'listo', cta: 'Repasar' };
  if (n > 0 || estado.ultima[m.id]) return { txt: 'En curso', cls: 'curso', cta: 'Continuar' };
  return { txt: 'Sin empezar', cls: '', cta: 'Empezar' };
}
// Lección a la que conviene entrar: la última vista si sigue pendiente, o la primera pendiente
function leccionDestino(m) {
  const ult = m.lessons.find(l => l.id === estado.ultima[m.id]);
  return (ult && !hecha(ult.id) ? ult : m.lessons.find(l => !hecha(l.id))) || ult || m.lessons[0];
}
const ruta = (m, l) => `#/m/${encodeURIComponent(m.id)}/${encodeURIComponent(l.id)}`;

// Portada abstracta por categoría (SVG propio, usa el color de acento del tema activo)
function portadaSVG(cat) {
  let f;
  if (cat === 'Negocio') { // barras ascendentes + línea de tendencia
    f = [...Array(9)].map((_, i) => { const h = 26 + i * 12; return `<rect x="${24 + i * 40}" y="${150 - h}" width="26" height="${h}" rx="5" fill="var(--accent)" opacity="${(.10 + i * .065).toFixed(2)}"/>`; }).join('') +
        '<path d="M24 112 C130 98 220 66 376 20" fill="none" stroke="var(--accent)" stroke-width="1.6" opacity=".7"/><circle cx="376" cy="20" r="4.5" fill="var(--accent)"/>';
  } else if (cat === 'Inteligencia Comercial') { // círculos concéntricos: alcance y foco
    f = [34, 64, 94, 124, 154, 184, 214].map((r, i) => `<circle cx="318" cy="112" r="${r}" fill="none" stroke="var(--accent)" stroke-width="1.3" opacity="${(.7 - i * .09).toFixed(2)}"/>`).join('') +
        '<circle cx="318" cy="112" r="9" fill="var(--accent)"/><circle cx="64" cy="38" r="14" fill="var(--accent)" opacity=".16"/><circle cx="64" cy="38" r="5" fill="var(--accent)" opacity=".6"/>';
  } else if (cat === 'Inteligencia Emocional') { // ondas suaves
    f = [38, 60, 82, 104, 126].map((y, i) => `<path d="M-10 ${y} Q 40 ${y - 34} 90 ${y} T 190 ${y} T 290 ${y} T 390 ${y} T 490 ${y}" fill="none" stroke="var(--accent)" stroke-width="1.5" opacity="${(.25 + i * .12).toFixed(2)}"/>`).join('');
  } else { // categoría nueva: trama de puntos
    f = [...Array(40)].map((_, i) => `<circle cx="${30 + (i % 10) * 38}" cy="${24 + Math.floor(i / 10) * 34}" r="3" fill="var(--accent)" opacity=".35"/>`).join('');
  }
  return `<svg viewBox="0 0 400 150" preserveAspectRatio="xMidYMid slice" class="w-full h-full block" aria-hidden="true">${f}</svg>`;
}

    (!q || plano([m.title, m.description, m.category, ...m.lessons.map(l => l.title)].join(' ')).includes(q)));

       <ul class="space-y-1">${l.keyTakeaways.map((k, n) => `
         <li class="clave ${aplicados.includes(n) ? 'done' : ''}">
           <button class="flex items-start gap-4 flex-1 text-left py-2.5" data-accion="clave" data-i="${n}" role="checkbox" aria-checked="${aplicados.includes(n)}"><span class="dot mt-1.5">${ic('check', '')}</span><span class="txt lec font-serif max-w-[62ch]">${esc(k)}</span></button>
           <button class="icon-btn !w-8 !h-8 flex-none mt-2" data-accion="clave-nota" data-i="${n}" title="Enviar a Mis apuntes" aria-label="Enviar a Mis apuntes">${ic('notebook-pen', 'w-3.5 h-3.5')}</button>
         </li>`).join('')}</ul>`
    : `<p class="text-muted">Esta clase no tiene puntos clave cargados.</p>`;

  // Enlace de consulta por WhatsApp con mensaje prearmado (nombre del socio, módulo y clase)
  const tel = String(PLATFORM_CONFIG.mentorWhatsapp || '').replace(/\D/g, '');
  const wa = tel && `https://wa.me/${tel}?text=${encodeURIComponent(`Hola, soy ${estado.nombre}. Tengo una consulta sobre la clase «${l.title}» del módulo «${m.title}» de ${PLATFORM_CONFIG.platformName}.`)}`;

  return `
  <div class="vista">
    <div class="no-foco flex items-center justify-between gap-4 mb-7">
      <a href="#/" class="flex items-center gap-2 text-sm text-muted hover:text-acento transition-colors">${ic('arrow-left')} Panel</a>
      <div class="flex items-center gap-2">
        <button class="btn !py-2 !px-4 !text-xs whitespace-nowrap" data-accion="foco" title="Modo foco (F)">${ic('maximize-2')} <span>Modo foco</span></button>
        <button class="btn !py-2 !px-4 !text-xs whitespace-nowrap" data-accion="indice" aria-expanded="${abierto}" aria-controls="indice">${ic('panel-left')} <span>Índice del módulo</span></button>
      </div>
    </div>
    <button class="btn !py-2 !px-4 !text-xs foco-salir" data-accion="foco" title="Salir del modo foco (Esc)">${ic('minimize-2')} <span>Salir del modo foco</span></button>

    <div class="sala ${abierto ? '' : 'sin-indice'}">
      <!-- Índice de lecciones -->
      <aside id="indice" class="indice glass p-5 mb-7 lg:mb-0 lg:sticky lg:top-24 lg:max-h-[calc(100vh-7.5rem)] lg:overflow-auto">
        <span class="eyebrow">${esc(m.category)}</span>
        <h2 class="text-xl mt-2 mb-4">${esc(m.title)}</h2>
        <div class="flex justify-between text-xs text-muted tabular-nums mb-2"><span data-mod-txt>${cuenta(m.lessons)} de ${m.lessons.length} clases</span><span data-mod-pct>${p}%</span></div>
        <div class="bar mb-5"><i data-mod-bar style="width:${p}%"></i></div>
        <nav class="space-y-1" aria-label="Clases del módulo">
          ${m.lessons.map((x, n) => `
          <a href="${ruta(m, x)}" data-item="${esc(x.id)}" class="item ${x.id === l.id ? 'actual' : ''} ${hecha(x.id) ? 'done' : ''}" ${x.id === l.id ? 'aria-current="page"' : ''}>
            <span class="dot">${ic('check', '')}</span>
            <span class="flex-1"><span class="block text-[.68rem] text-muted tracking-wider uppercase">Clase ${n + 1} · ${esc(x.duration)}</span>${esc(x.title)}</span>
          </a>`).join('')}
        </nav>
      </aside>

      <!-- Contenido de la clase -->
      <div class="contenido min-w-0">
        <!-- Tira de avance del módulo: un segmento por clase -->
        <div class="mb-4">
          <div class="flex items-center justify-between text-xs text-muted tabular-nums mb-2.5"><span>Avance del módulo</span><span data-strip-txt>${cuenta(m.lessons)} de ${m.lessons.length} clases</span></div>
          <div class="flex gap-1.5">${m.lessons.map((x, n) => `<a href="${ruta(m, x)}" data-seg="${esc(x.id)}" class="seg ${hecha(x.id) ? 'done' : ''} ${x.id === l.id ? 'actual' : ''}" title="${esc(x.title)}" aria-label="Clase ${n + 1}: ${esc(x.title)}"></a>`).join('')}</div>
        </div>
        <div class="player">${video}</div>

        <div class="flex flex-wrap items-start justify-between gap-x-8 gap-y-5 mt-9">
          <div class="min-w-0">
            <div class="flex flex-wrap items-center gap-3 mb-3">
              <span class="eyebrow">Clase ${i + 1} de ${m.lessons.length} · ${esc(l.duration)}</span>
              <span id="badge" class="badge ${ok ? 'listo' : 'curso'}">${ok ? 'Completado' : 'En curso'}</span>
            </div>
            <h1 class="text-3xl sm:text-4xl">${esc(l.title)}</h1>
          </div>
          <button id="completar" class="btn btn-cta w-full sm:w-auto ${ok ? 'hecha' : ''}" data-accion="completar" aria-pressed="${ok}">${ic('check')}<span>${ok ? 'Clase completada' : 'Marcar clase como completada'}</span></button>
        </div>

        <!-- Pestañas -->
        <div class="flex gap-7 border-b border-linea mt-9 overflow-x-auto sin-scroll" role="tablist">
          ${TABS.map(t => `<button class="tab ${t.id === tabActiva ? 'activa' : ''}" role="tab" data-accion="tab" data-tab="${t.id}" aria-selected="${t.id === tabActiva}">${ic(t.icono)}${t.txt}</button>`).join('')}
          <div class="ml-auto flex items-center gap-1 pl-4 flex-none self-center" role="group" aria-label="Tamaño de lectura">
            <button class="icon-btn !w-8 !h-8 font-serif text-xs" data-accion="fuente" data-d="-1" aria-label="Reducir texto" title="Reducir texto">A−</button>
            <button class="icon-btn !w-8 !h-8 font-serif text-base" data-accion="fuente" data-d="1" aria-label="Agrandar texto" title="Agrandar texto">A+</button>
          </div>
        </div>
        <div class="py-8 min-h-[220px]">
          <div class="panel" data-panel="pdf" ${tabActiva === 'pdf' ? '' : 'hidden'}>${pdf}</div>
          <div class="panel" data-panel="claves" ${tabActiva === 'claves' ? '' : 'hidden'}>${claves}</div>
          <div class="panel" data-panel="resumen" ${tabActiva === 'resumen' ? '' : 'hidden'}><p class="lec font-serif max-w-[66ch]">${esc(l.summary)}</p></div>
          <div class="panel" data-panel="apuntes" hidden>
            <label for="apuntes" class="sr-only">Mis apuntes de esta clase</label>
            <div class="flex flex-wrap items-center justify-between gap-3 mb-3">
              <span id="apuntes-estado" class="flex items-center gap-2 text-xs text-muted" role="status">${ic('check', 'w-3.5 h-3.5 text-acento')}<span>${TXT_GUARDADO}</span></span>
              <div class="flex flex-wrap gap-2">
                <button class="btn !py-2 !px-3 !text-xs" data-accion="lista" title="Convertir la línea en lista">${ic('list')}<span>Lista</span></button>
                <button class="btn !py-2 !px-3 !text-xs" data-accion="exportar" title="Descargar como archivo de texto">${ic('download')}<span>Exportar .txt</span></button>
                <button class="btn !py-2 !px-3 !text-xs" data-accion="copiar">${ic('copy')}<span>Copiar apuntes</span></button>
              </div>
            </div>
            <textarea id="apuntes" class="campo block font-serif lec min-h-[260px] resize-y" placeholder="Anotá acá tus ideas, dudas y compromisos de esta clase…">${esc(estado.apuntes[l.id] || '')}</textarea>
          </div>
        </div>

        ${wa ? `
        <!-- Consulta por WhatsApp -->
        <div class="no-foco flex flex-wrap items-center justify-between gap-4 pb-7">
          <p class="text-sm text-muted">¿Te quedó alguna duda? Escribinos por WhatsApp.</p>
          <a class="btn !py-2 !px-4 !text-xs" href="${esc(wa)}" target="_blank" rel="noopener noreferrer">${ic('message-circle')} Consultar sobre esta clase</a>
        </div>` : ''}

        <!-- Navegación -->
        <nav class="flex flex-col sm:flex-row justify-between gap-3 pt-7 border-t border-linea">
          ${ant ? `<a class="btn" href="${ruta(m, ant)}">${ic('arrow-left')} Anterior</a>` : '<span></span>'}
          ${sig ? `<a class="btn" href="${ruta(m, sig)}">Siguiente ${ic('arrow-right')}</a>` : `<a class="btn" href="#/">Volver al panel ${ic('arrow-right')}</a>`}
        </nav>
        <p class="hidden md:block text-center text-xs text-muted pt-6"><kbd>←</kbd> <kbd>→</kbd> cambiar de clase · <kbd>C</kbd> completar · <kbd>N</kbd> apuntes · <kbd>F</kbd> modo foco</p>
      </div>
    </div>
  </div>`;
}

// Actualiza en vivo los indicadores de progreso sin recargar el video
function pintarProgreso(m, l) {
  const ok = hecha(l.id), pg = pct(LECCIONES), pm = pct(m.lessons), $ = s => document.querySelector(s);
  const b = $('#completar');
  b.classList.toggle('hecha', ok); b.setAttribute('aria-pressed', ok);
  b.querySelector('span').textContent = ok ? 'Clase completada' : 'Marcar clase como completada';
  const badge = $('#badge'); badge.className = 'badge ' + (ok ? 'listo' : 'curso'); badge.textContent = ok ? 'Completado' : 'En curso';
  $(`[data-item="${CSS.escape(l.id)}"]`).classList.toggle('done', ok);
  $(`[data-seg="${CSS.escape(l.id)}"]`).classList.toggle('done', ok);
  $('[data-strip-txt]').textContent = `${cuenta(m.lessons)} de ${m.lessons.length} clases`;
  $('[data-mod-bar]').style.width = pm + '%'; $('[data-mod-pct]').textContent = pm + '%';
  $('[data-mod-txt]').textContent = `${cuenta(m.lessons)} de ${m.lessons.length} clases`;
  $('[data-global-bar]').style.width = pg + '%'; $('[data-global-txt]').textContent = pg + '% completado';
}

// Celebración sobria: onda en el botón + aviso; si se cierra un módulo, tarjeta de logro
function celebrar(m) {
  const b = document.getElementById('completar');
  b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop');
  setTimeout(() => b.classList.remove('pop'), 800);
  if (pct(m.lessons) === 100) return celebrarModulo(m);
  const resto = m.lessons.length - cuenta(m.lessons);
  aviso(`¡Clase completada! ${resto === 1 ? 'Te falta 1 para cerrar el módulo' : `Te faltan ${resto} para cerrar el módulo`}.`);
}
function celebrarModulo(m) {
  const todo = pct(LECCIONES) === 100;
  const sig = MODULOS.find(x => x !== m && pct(x.lessons) < 100);
  const d = document.createElement('div');
  d.className = 'celebra'; d.setAttribute('role', 'dialog'); d.setAttribute('aria-modal', 'true'); d.setAttribute('aria-labelledby', 'celebra-t');
  d.innerHTML = `<div class="glass celebra-card">
    <div class="sello">${[...Array(12)].map((_, i) => `<i class="rayo" style="--a:${i * 30}deg"></i>`).join('')}
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <span class="eyebrow">${todo ? 'Programa completado' : 'Módulo completado'}</span>
    <h2 id="celebra-t" class="text-3xl mt-3">${todo ? `Lo lograste, ${esc(estado.nombre)}` : `Completaste «${esc(m.title)}»`}</h2>
    <p class="text-muted mt-3">${todo ? 'Terminaste todas las clases del campus. Podés volver a cualquiera para repasar.' : 'Buen trabajo. Lo que aprendiste vale cuando lo ponés en práctica: revisá tus puntos clave esta semana.'}</p>
    <div class="flex flex-col gap-3 mt-8">
      ${sig && !todo ? `<a class="btn btn-cta" href="${ruta(sig, leccionDestino(sig))}" data-accion="cerrar-celebra">Ir a «${esc(sig.title)}» ${ic('arrow-right')}</a>` : ''}
      <div class="flex gap-3">
        <a class="btn flex-1" href="#/" data-accion="cerrar-celebra">Volver al panel</a>
        <button class="btn flex-1" data-accion="cerrar-celebra">Seguir acá</button>
      </div>
    </div></div>`;
  document.body.appendChild(d); iconos();
  d.querySelector('a,button').focus();
}
const cerrarCelebra = () => document.querySelector('.celebra')?.remove();

// Modo foco: oculta todo salvo la tira de avance, el video y la clase
function alternarFoco(v = !foco) { foco = v; document.body.classList.toggle('foco', foco); window.scrollTo(0, 0); }

// Pestañas de la sala
function abrirTab(id) {
  tabActiva = id;
  document.querySelectorAll('.tab').forEach(t => { const a = t.dataset.tab === id; t.classList.toggle('activa', a); t.setAttribute('aria-selected', a); });
  document.querySelectorAll('[data-panel]').forEach(p => p.hidden = p.dataset.panel !== id);
}

// Tamaño de lectura (3 niveles)
function aplicarFuente() {
  document.documentElement.style.setProperty('--lec', ['1.05rem', '1.2rem', '1.4rem'][estado.fuente]);
  document.querySelectorAll('[data-accion="fuente"]').forEach(b => b.disabled = (+b.dataset.d < 0 && estado.fuente === 0) || (+b.dataset.d > 0 && estado.fuente === 2));
}

// Descarga los apuntes de la clase como .txt
function exportarApuntes() {
  const { m, l } = actual, txt = document.getElementById('apuntes').value;
  if (!txt.trim()) return aviso('Todavía no hay apuntes para exportar', 'info');
  const cuerpo = `${l.title}\n${m.title} · ${PLATFORM_CONFIG.platformName}\n\n${txt}\n`;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([cuerpo], { type: 'text/plain;charset=utf-8' }));
  a.download = `Apuntes - ${l.title}`.replace(/[\\/:*?"<>|]/g, '') + '.txt';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  aviso('Apuntes exportados', 'download');
}

// Convierte la línea actual (o las seleccionadas) en lista con viñetas
function listarApuntes() {
  const t = document.getElementById('apuntes'), v = t.value;
  const ini = v.lastIndexOf('\n', t.selectionStart - 1) + 1;
  let fin = v.indexOf('\n', t.selectionEnd); if (fin < 0) fin = v.length;
  const bloque = v.slice(ini, fin).split('\n').map(x => x.startsWith('• ') ? x : '• ' + x).join('\n');
  t.value = v.slice(0, ini) + bloque + v.slice(fin);
  t.focus(); t.setSelectionRange(ini + bloque.length, ini + bloque.length);
  t.dispatchEvent(new Event('input', { bubbles: true }));
}

// Copia los apuntes al portapapeles y lo confirma en el propio botón
async function copiarApuntes(b) {
  const area = document.getElementById('apuntes'), txt = b.querySelector('span');
  let msg = '¡Copiado!';
  if (!area.value.trim()) msg = 'Todavía no hay apuntes';
  else try { await navigator.clipboard.writeText(area.value); }
       catch (e) { area.select(); msg = document.execCommand('copy') ? '¡Copiado!' : 'No se pudo copiar'; } // respaldo para navegadores viejos
  txt.textContent = msg; b.classList.toggle('copiado', msg === '¡Copiado!');
  clearTimeout(b._t); b._t = setTimeout(() => { txt.textContent = 'Copiar apuntes'; b.classList.remove('copiado'); }, 2000);
}

/* ==========================================================================
   8. ENRUTADOR Y EVENTOS
   ========================================================================== */
let actual = null; // { m, l } cuando se está en la sala de estudio

function render() {
  if (!estado.acceso || !estado.nombre) { foco = false; document.body.classList.remove('foco'); vistaAcceso(); iconos(); return; } // sin nombre guardado se vuelve a pedir

  const r = location.hash.match(/^#\/m\/([^/]+)\/([^/]+)$/);
  const m = r && MODULOS.find(x => x.id === decodeURIComponent(r[1]));
  const l = m && m.lessons.find(x => x.id === decodeURIComponent(r[2]));
  actual = l ? { m, l } : null;
  if (l) { estado.ultima[m.id] = l.id; estado.ultimaClase = l.id; guardar(); registrarDia(); }

  app.innerHTML = cabecera() +
    `<main class="max-w-[1240px] mx-auto px-4 sm:px-6 pt-8 sm:pt-12 pb-24">${l ? vistaSala(m, l) : vistaDashboard()}</main>` +
    `<footer class="text-center text-xs text-muted tracking-wide pb-10 px-4">${esc(PLATFORM_CONFIG.platformName)} · Campus privado</footer>`;
  if (!l) foco = false;                       // el modo foco solo existe dentro de una clase
  document.body.classList.toggle('foco', foco);
  window.scrollTo(0, 0);

  if (!l) {
    pintarGrilla();
    document.getElementById('buscador').addEventListener('input', e => { busqueda = e.target.value; pintarGrilla(); });
    const anillo = document.querySelector('.anillo .valor'); // anima el anillo al entrar
    requestAnimationFrame(() => requestAnimationFrame(() => anillo.style.strokeDashoffset = anillo.dataset.off));
  }
  aplicarFuente();
  iconos();
}

// Un solo listener para todos los botones (delegación por data-accion)
document.addEventListener('click', e => {
  if (e.target.classList.contains('celebra')) return cerrarCelebra(); // clic en el fondo cierra la tarjeta de logro
  const b = e.target.closest('[data-accion]'); if (!b) return;
  switch (b.dataset.accion) {
    case 'tema':
      estado.tema = TEMAS[(TEMAS.indexOf(document.documentElement.dataset.theme) + 1) % TEMAS.length];
      document.documentElement.dataset.theme = estado.tema; guardar(); break;
    case 'salir':
      estado.acceso = false; guardar(); location.hash = '#/'; render(); break; // el progreso se conserva
    case 'filtro':
      filtro = b.dataset.cat; pintarGrilla(); break;
    case 'limpiar':
      filtro = 'Todos'; busqueda = ''; document.getElementById('buscador').value = ''; pintarGrilla(); break;
    case 'tab':
      abrirTab(b.dataset.tab); break;
    case 'foco':
      alternarFoco(); break;
    case 'fuente':
      estado.fuente = Math.min(2, Math.max(0, estado.fuente + +b.dataset.d)); guardar(); aplicarFuente(); break;
    case 'cerrar-celebra':
      cerrarCelebra(); break;
    case 'clave': { // tilda o destilda un punto clave como "aplicado"
      const i = +b.dataset.i, arr = estado.claves[actual.l.id] || [], k = arr.indexOf(i);
      if (k < 0) arr.push(i); else arr.splice(k, 1);
      if (arr.length) estado.claves[actual.l.id] = arr; else delete estado.claves[actual.l.id];
      guardar();
      b.closest('.clave').classList.toggle('done', k < 0); b.setAttribute('aria-checked', k < 0);
      document.querySelector('[data-claves-txt]').textContent = `${arr.length} de ${actual.l.keyTakeaways.length} aplicados`; break;
    }
    case 'clave-nota': { // agrega el punto clave a "Mis apuntes" como viñeta
      const linea = '• ' + actual.l.keyTakeaways[+b.dataset.i], previo = estado.apuntes[actual.l.id] || '';
      if (previo.includes(linea)) { aviso('Ese punto ya está en tus apuntes', 'info'); break; }
      estado.apuntes[actual.l.id] = (previo.trimEnd() ? previo.trimEnd() + '\n' : '') + linea + '\n'; guardar();
      document.getElementById('apuntes').value = estado.apuntes[actual.l.id];
      aviso('Agregado a Mis apuntes', 'notebook-pen'); break;
    }
    case 'lista':
      listarApuntes(); break;
    case 'exportar':
      exportarApuntes(); break;
    case 'indice': {
      const cerrado = document.querySelector('.sala').classList.toggle('sin-indice');
      b.setAttribute('aria-expanded', !cerrado);
      if (matchMedia('(min-width:1024px)').matches) { estado.indiceCerrado = cerrado; guardar(); } break;
    }
    case 'copiar':
      copiarApuntes(b); break;
    case 'completar':
      if (hecha(actual.l.id)) delete estado.hechas[actual.l.id]; else estado.hechas[actual.l.id] = true;
      guardar(); pintarProgreso(actual.m, actual.l);
      if (hecha(actual.l.id)) { registrarDia(); celebrar(actual.m); }
      break;
  }
});
// Guardado automático de apuntes mientras se escribe
let avisoApuntes;
document.addEventListener('input', e => {
  if (e.target.id !== 'apuntes' || !actual) return;
  if (e.target.value.trim()) estado.apuntes[actual.l.id] = e.target.value; else delete estado.apuntes[actual.l.id];
  guardar();
  const aviso = document.querySelector('#apuntes-estado span'); aviso.textContent = 'Guardando…';
  clearTimeout(avisoApuntes);
  avisoApuntes = setTimeout(() => { const a = document.querySelector('#apuntes-estado span'); if (a) a.textContent = TXT_GUARDADO; }, 600);
});
// Atajos de teclado dentro de la sala de estudio
document.addEventListener('keydown', e => {
  const t = e.target;
  // En "Mis apuntes", Enter continúa la lista con viñetas (Enter sobre una viñeta vacía sale de la lista)
  if (t.id === 'apuntes' && e.key === 'Enter' && !e.shiftKey && !e.isComposing && t.selectionStart === t.selectionEnd) {
    const v = t.value, pos = t.selectionStart, ini = v.lastIndexOf('\n', pos - 1) + 1, linea = v.slice(ini, pos);
    if (linea.startsWith('• ')) {
      e.preventDefault();
      if (linea === '• ') t.setRangeText('', ini, pos, 'end'); else t.setRangeText('\n• ', pos, pos, 'end');
      t.dispatchEvent(new Event('input', { bubbles: true }));
    }
    return;
  }
  if (e.key === 'Escape') { if (document.querySelector('.celebra')) cerrarCelebra(); else if (foco) alternarFoco(false); return; }
  if (!actual || e.ctrlKey || e.metaKey || e.altKey || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable) return;
  const ls = actual.m.lessons, i = ls.indexOf(actual.l);
  switch (e.key.toLowerCase()) {
    case 'arrowright': if (ls[i + 1]) location.hash = ruta(actual.m, ls[i + 1]); break;
    case 'arrowleft':  if (ls[i - 1]) location.hash = ruta(actual.m, ls[i - 1]); break;
    case 'c': document.getElementById('completar').click(); break;
    case 'f': alternarFoco(); break;
    case 'n': e.preventDefault(); abrirTab('apuntes'); document.getElementById('apuntes').focus(); break;
  }
});

// Cambio de vista con transición suave cuando el navegador la soporta
window.addEventListener('hashchange', () => {
  if (document.startViewTransition && !matchMedia('(prefers-reduced-motion: reduce)').matches) document.startViewTransition(render); else render();
});
render();
</script>
</body>
</html>
